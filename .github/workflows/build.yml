name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          set -e
          flutter create --platforms=android --project-name krishi --org com.qynvaro build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart
          M=build_app/android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="কৃষি"/' $M
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $M
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          for d, s in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              im = Image.new('RGB', (s, s), (0, 106, 78))
              r, cx, cy = s * 0.3, s * 0.45, s * 0.5
              ImageDraw.Draw(im).ellipse((cx - r, cy - r, cx + r, cy + r), fill=(244, 42, 65))
              im.save(f'build_app/android/app/src/main/res/mipmap-{d}/ic_launcher.png')
          EOF
          cd build_app
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: krishi-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
